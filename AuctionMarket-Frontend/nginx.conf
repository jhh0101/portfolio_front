server {
    listen 80;
    server_name auction-market.duckdns.org;

    # ==========================================
    # [공통 베이스 설정]
    # ==========================================
    client_max_body_size 50M; # 파일 업로드 크기 (필요시 숫자 변경)
    keepalive_timeout 65;

    # ==========================================
    # [블록 1] 프론트엔드 설정 (둘 중 하나만 선택)
    # ==========================================

    # 옵션 A: 일반 HTML/정적 웹사이트일 때
    # location / {
    #     root /usr/share/nginx/html;
    #     index index.html;
    # }

    # 옵션 B: React, Vue 등 SPA 프레임워크일 때 (이걸 씁니다!)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 새로고침 404 방지
    }

    # ==========================================
    # [블록 2] 백엔드 API 연결 설정
    # ==========================================
    location /api/ {
        # 백엔드 주소로 변경 (도커 컨테이너 이름 or IP)
        proxy_pass http://backend:8888;

        # 헤더 전달 (필수 뼈대)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 추가 옵션: 백엔드에서 파일 처리/로직이 오래 걸려서 자꾸 끊길 때 주석 해제
        # proxy_connect_timeout 300s;
        # proxy_send_timeout 300s;
        # proxy_read_timeout 300s;
    }
}